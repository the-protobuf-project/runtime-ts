name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        if: matrix.runtime == 'node'
        with:
          node-version: 24
      # Every job installs Deno: the Deno sandbox tests run under all three runtimes.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - name: Type-check and line limit
        if: matrix.runtime == 'bun'
        run: |
          bun run typecheck
          bun run lint:lines
      - name: Test on Bun
        if: matrix.runtime == 'bun'
        run: bun run test
      - name: Test on Node
        if: matrix.runtime == 'node'
        run: bun run test:node
      - name: Test on Deno
        if: matrix.runtime == 'deno'
        run: bun run test:deno
